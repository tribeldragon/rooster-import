<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Screenshot van je weekrooster, direct om naar Google Agenda of Outlook." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the theme before first paint so there is no flash. Dark unless the user chose light.
      try { document.documentElement.dataset.theme = localStorage.getItem('rooster-import.theme') === 'light' ? 'light' : 'dark'; }
      catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <title>Rooster Import</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
