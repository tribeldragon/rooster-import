name: CI

on:
  push:
    branches-ignore: [main] # main is checked by the deploy workflow
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # lint and test need no OCR assets, so skip install scripts entirely
      - run: npm ci --ignore-scripts

      - run: npm run lint

      - run: npm test

      # the build copies public/, so fetch the OCR assets (checksum-verified) with a cache
      - uses: actions/cache@v4
        with:
          path: public/tessdata
          key: tessdata-${{ hashFiles('scripts/prepare-assets.mjs') }}

      - run: npm run prepare-assets

      - run: npm run build
